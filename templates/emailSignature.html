<!DOCTYPE html>
<html>
<head>
  <title>Email Signature</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .email-signature {
      max-width: 500px;
      margin: 0 auto;
      font-size: 16px;
      color: #333;
      border-bottom: 2px solid #ccc;
      padding: 20px;
    }
    .name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .title {
      font-size: 16px;
      margin-bottom: 5px;
    }
    .company {
      font-size: 16px;
      margin-bottom: 5px;
    }
    .address {
      font-size: 16px;
      margin-bottom: 5px;
    }
    .phone {
      font-size: 16px;
      margin-bottom: 5px;
    }
    .website {
      font-size: 16px;
      margin-bottom: 5px;
      text-decoration: none;
      color: #007bff;
    }
  </style>
</head>
<body>

<div class="email-signature">
  <p class="name">Pranabesh Bhaumik</p>
  <p class="title">Director</p>
  <p class="company">Conacent Consulting Pvt Ltd</p>
  <p class="address">CF-90 Salt Lake, Sector 1<br>Kolkata - 700064, INDIA</p>
  <p class="phone">Ph: +91 98300 79710</p>
  <p class="website"><a href="http://www.conacent.com" target="_blank">www.conacent.com</a></p>
</div>

</body>
</html>
