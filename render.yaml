services:
  - type: web
    name: payslips
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 900
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SMTP2GO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        value: mail.smtp2go.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_DEBUG
        value: "0"
      - key: SMTP_RETRY_DELAY_SECONDS
        value: "600"
      - key: SMTP_TIMEOUT_SECONDS
        value: "50"
      - key: IMAP_HOST
        value: mail.conacent.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_SENT_FOLDER
        value: Sent
      - key: JOB_STATE_DIR
        value: /tmp/payslips_jobs
      - key: JOB_WORKER_THREADS
        value: "2"
