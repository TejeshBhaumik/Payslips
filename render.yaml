services:
  - type: web
    name: payslips
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 900
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SMTP2GO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        value: mail.smtp2go.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sy